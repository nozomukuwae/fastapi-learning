services:
  fastapi:
    build: .
    environment:
      DATABASE_ADDRESS: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: "TodoApplicationDatabase"
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql
    healthcheck:
      # DBが接続可能か確認する
      test: ["CMD-SHELL", "pg_isready -U postgres -d TodoApplicationDatabase"]
      interval: 5s
      timeout: 5s
      retries: 5